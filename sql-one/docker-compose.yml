# Bancada do SQL One, alinhada ao capítulo 3.
#   docker compose up -d
#   docker exec -it santarita psql -U postgres
services:
  postgres:
    image: postgres:18
    container_name: santarita
    environment:
      POSTGRES_PASSWORD: santarita
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ./dados:/dados:ro
