  testes:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:teste@localhost/teste
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - run: make deps
      - run: make migrar
      - run: make testes
