name: volta
on:
  workflow_dispatch:
    inputs:
      motivo:
        description: "O que aconteceu (vai para o registro)"
        required: true
jobs:
  vira:
    runs-on: ubuntu-24.04
    environment: producao
    concurrency: { group: deploy-producao }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/chave-ssh
        with:
          chave: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ./scripts/vira-de-volta.sh
