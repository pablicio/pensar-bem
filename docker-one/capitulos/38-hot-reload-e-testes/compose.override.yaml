services:
  api:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0",
              "--port", "8000", "--reload"]
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./api/requirements.txt
