x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    options: { max-size: "20m", max-file: "5" }

services:
  proxy:
    image: caddy:2.10
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [frente]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 128m } } }

  api_azul: &api_prod
    <<: *endurecido
    image: ghcr.io/serra-ingressos/api:${VERSAO_AZUL:-0}
    profiles: [azul]
    env_file: [api.env]
    tmpfs: ["/tmp:size=64m"]
    secrets: [senha_banco, chave_pagamento]
    networks:
      frente: { aliases: [api] }
      dados:
    deploy:
      replicas: 3
      resources: { limits: { memory: 512m, cpus: "1.0", pids: 200 } }

  api_verde:
    <<: *api_prod
    image: ghcr.io/serra-ingressos/api:${VERSAO_VERDE:-0}
    profiles: [verde]

  api:
    profiles: [nunca]

  checkin:
    depends_on: !reset {}

  banco:
    secrets: [senha_banco]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/senha_banco
    deploy: { resources: { limits: { memory: 2g } } }

secrets:
  senha_banco: { file: ./segredos/senha_banco.txt }
  chave_pagamento: { file: ./segredos/chave_pagamento.txt }
  chave_prefeitura: { file: ./segredos/chave_prefeitura.txt }

volumes:
  caddy_dados:
  caddy_config:
